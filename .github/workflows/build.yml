name: Build OxDrift APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK bits
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Cache Godot
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.2.2-stable

      - name: Download Godot + templates
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          chmod +x Godot_v4.2.2-stable_linux.x86_64

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          cp ~/godot/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Debug keystore in all locations
        run: |
          mkdir -p ~/.android ~/.local/share/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "cn=Android Debug,O=OxClub,C=US" -validity 9999
          cp ~/.android/debug.keystore ~/.local/share/godot/debug.keystore

      - name: Import (Godot writes its own settings)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ~/godot/Godot_v4.2.2-stable_linux.x86_64 --headless --path . --import

      - name: Insert Android keys into Godot's settings
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          KEYS="$HOME/keys.tmp"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } > "$KEYS"
          for S in ~/.config/godot/editor_settings*.tres; do
            [ -e "$S" ] || continue
            sed -i '/export\/android\/android_sdk_path/d;/export\/android\/java_sdk_path/d;/export\/android\/debug_keystore/d;/export\/android\/debug_keystore_user/d;/export\/android\/debug_keystore_pass/d' "$S"
            sed -i "/^\[resource\]/r $KEYS" "$S"
            echo "--- injected into $S ---"
          done
          rm -f "$KEYS"

      - name: Export APK (auto-dumps full forensics on failure)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p build
          if ~/godot/Godot_v4.2.2-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android" build/OxDrift.apk 2>&1; then
            echo ""
            echo "=== EXPORT SUCCESS ==="
          else
            echo ""
            echo "############################################"
            echo "#  EXPORT FAILED - FULL TRUTH DUMP BELOW   #"
            echo "############################################"
            echo "--- 1. settings files Godot made ---"
            ls -la ~/.config/godot/
            for S in ~/.config/godot/editor_settings*.tres; do
              [ -e "$S" ] && { echo "--- FILE: $S ---"; cat "$S"; }
            done
            echo "--- 2. android keys present? ---"
            grep -n "export/android" ~/.config/godot/editor_settings*.tres || echo "!!! NO ANDROID KEYS FOUND ANYWHERE !!!"
            echo "--- 3. templates ---"
            ls -la ~/.local/share/godot/export_templates/4.2.2.stable/ | head -20
            test -f ~/.local/share/godot/export_templates/4.2.2.stable/android_debug.apk && echo "OK: android_debug.apk EXISTS" || echo "FAIL: android_debug.apk MISSING"
            echo "--- 4. keystores ---"
            ls -la ~/.android/debug.keystore ~/.local/share/godot/debug.keystore
            echo "--- 5. java ---"
            echo "JAVA_HOME=$JAVA_HOME"
            java -version 2>&1 | head -2
            echo "--- 6. sdk pieces ---"
            ls "$ANDROID_HOME/platform-tools/adb" && echo "OK: adb EXISTS"
            find "$ANDROID_HOME/build-tools" -name apksigner
            echo "--- 7. export preset ---"
            cat export_presets.cfg
            echo "############################################"
            echo "#  END OF TRUTH DUMP                       #"
            echo "############################################"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxDrift-APK
          path: build/OxDrift.apk
          if-no-files-found: error
