name: Build OxDrift APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK bits
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Cache Godot
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable

      - name: Download Godot + templates
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_export_templates.tpz
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp ~/godot/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Create debug keystores (both locations)
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "cn=Android Debug,O=Android,C=US" -validity 9999
          cp ~/.android/debug.keystore ~/.local/share/godot/debug.keystore

      - name: Write editor settings (pass 1, before import)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p ~/.config/godot
          {
            echo "config_version=5"
            echo ""
            echo "[export]"
            echo ""
            echo "android/android_sdk_path = \"$ANDROID_HOME\""
            echo "android/java_sdk_path = \"$JAVA_HOME\""
            echo "android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo "android/debug_keystore_user = \"androiddebugkey\""
            echo "android/debug_keystore_pass = \"android\""
          } > ~/.config/godot/editor_settings-4.3.tres

      - name: Import resources
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --import

      - name: Write editor settings (pass 2, AFTER import)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          {
            echo "config_version=5"
            echo ""
            echo "[export]"
            echo ""
            echo "android/android_sdk_path = \"$ANDROID_HOME\""
            echo "android/java_sdk_path = \"$JAVA_HOME\""
            echo "android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo "android/debug_keystore_user = \"androiddebugkey\""
            echo "android/debug_keystore_pass = \"android\""
          } > ~/.config/godot/editor_settings-4.3.tres
          echo "=== settings before export ==="
          cat ~/.config/godot/editor_settings-4.3.tres
          echo "=== templates ==="
          ls ~/.local/share/godot/export_templates/4.3.stable/ | head -8
          echo "=== keystores ==="
          ls -la ~/.android/debug.keystore ~/.local/share/godot/debug.keystore

      - name: Export APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          mkdir -p build
          ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android" build/OxDrift.apk 2>&1 | tail -100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxDrift-APK
          path: build/OxDrift.apk
          if-no-files-found: error
