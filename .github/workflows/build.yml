name: Build OxDrift APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK bits
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Make debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "cn=Android Debug,O=OxClub,C=US" -validity 9999
          echo "KS_B64=$(base64 -w0 debug.keystore)" >> "$GITHUB_ENV"

      - name: Export APK (godot-export action)
        uses: firebelley/godot-export@v5.2.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: .
          export_debug: true
          cache: true
          verbose: true
        env:
          SECRET_DEBUG_KEYSTORE_BASE64: ${{ env.KS_B64 }}
          SECRET_DEBUG_KEYSTORE_USER: androiddebugkey
          SECRET_DEBUG_KEYSTORE_PASSWORD: android

      - name: Find the APK
        if: always()
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxDrift-APK
          path: "**/*.apk"
          if-no-files-found: error
