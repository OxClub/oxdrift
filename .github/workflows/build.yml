name: Build OxDrift APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Godot
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.2.2-stable

      - name: Download Godot + templates
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          chmod +x Godot_v4.2.2-stable_linux.x86_64

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          cp ~/godot/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "cn=Android Debug,O=OxClub,C=US" -validity 9999

      - name: Pack the game PCK (no export validation involved!)
        run: |
          sed -i '/config\/icon/d' project.godot
          mkdir -p build
          {
            printf 'extends SceneTree\n'
            printf '\n'
            printf 'func _initialize():\n'
            printf '\tvar pck := PCKPacker.new()\n'
            printf '\tpck.pck_start("build/OxDrift.pck")\n'
            printf '\tfor f in ["res://project.godot", "res://Main.tscn", "res://main.gd", "res://car.gd"]:\n'
            printf '\t\tpck.add_file(f, f)\n'
            printf '\tpck.flush()\n'
            printf '\tquit()\n'
          } > build_pck.gd
          cat build_pck.gd
          ~/godot/Godot_v4.2.2-stable_linux.x86_64 --headless --path . --script build_pck.gd
          echo "=== PCK created ==="
          ls -la build/

      - name: Assemble APK manually (zip + zipalign + apksigner)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e
          cp ~/.local/share/godot/export_templates/4.2.2.stable/android_debug.apk OxDrift-raw.apk
          zip -d OxDrift-raw.apk "assets/_pck" "META-INF/*" || echo "nothing to delete, fine"
          mkdir -p assets
          cp build/OxDrift.pck assets/_pck
          zip -X -0 OxDrift-raw.apk assets/_pck
          BT=$ANDROID_HOME/build-tools/34.0.0
          $BT/zipalign -f 4 OxDrift-raw.apk OxDrift-aligned.apk
          $BT/apksigner sign --ks ~/.android/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out OxDrift.apk OxDrift-aligned.apk
          $BT/apksigner verify --verbose OxDrift.apk | head -6
          echo "=== FINAL APK ==="
          ls -la OxDrift.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxDrift-APK
          path: OxDrift.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OxDrift Build ${{ github.run_number }}
          files: OxDrift.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
