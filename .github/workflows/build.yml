name: Build OxDrift APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK bits
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Cache Godot
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable-v2

      - name: Download Godot + templates
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_export_templates.tpz
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp ~/godot/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Debug keystore in ALL locations Godot might check
        run: |
          mkdir -p ~/.android ~/.local/share/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "cn=Android Debug,O=OxClub,C=US" -validity 9999
          cp ~/.android/debug.keystore ~/.local/share/godot/debug.keystore

      - name: Import (Godot writes its own settings file)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --import

      - name: Insert Android keys into Godot's own settings (top of section)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          S="$HOME/.config/godot/editor_settings-4.3.tres"
          echo "=== Godot settings file (before) ==="
          cat "$S"
          KEYS="$HOME/keys.tmp"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } > "$KEYS"
          sed -i "/^\[resource\]/r $KEYS" "$S"
          rm -f "$KEYS"
          echo "=== after insert ==="
          grep -n "export/android" "$S"

      - name: Verify Godot's world (the silent checks, made loud)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "=== TEMPLATES ==="
          ls -la ~/.local/share/godot/export_templates/4.3.stable/ | head -12
          test -f ~/.local/share/godot/export_templates/4.3.stable/android_debug.apk && echo "OK android_debug.apk present" || echo "FAIL android_debug.apk MISSING"
          test -f ~/.local/share/godot/export_templates/4.3.stable/android_release.apk && echo "OK android_release.apk present" || echo "FAIL android_release.apk MISSING"
          echo "=== KEYSTORES ==="
          ls -la ~/.android/debug.keystore ~/.local/share/godot/debug.keystore
          echo "=== SDK ==="
          ls "$ANDROID_HOME/build-tools/"
          find "$ANDROID_HOME/build-tools" -name apksigner | head -2
          ls "$ANDROID_HOME/platforms/"

      - name: Export APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          mkdir -p build
          ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android" build/OxDrift.apk 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxDrift-APK
          path: build/OxDrift.apk
          if-no-files-found: error
