name: Build OxDrift APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make sure Android SDK pieces exist
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Make debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "cn=Android Debug,O=OxClub,C=US" -validity 9999
          B64=$(base64 -w0 debug.keystore)
          echo "KS_B64=$B64" >> "$GITHUB_ENV"

      - name: Export APK (Godot CI action)
        uses: firebelley/godot-export@main
        with:
          godot_version: '4.3'
          export_debug: true
        env:
          SECRET_DEBUG_KEYSTORE_BASE64: ${{ env.KS_B64 }}
          SECRET_DEBUG_KEYSTORE_USER: androiddebugkey
          SECRET_DEBUG_KEYSTORE_PASSWORD: android

      - name: Find the APK
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxDrift-APK
          path: "**/*.apk"
          if-no-files-found: error
